openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: mock-auth
    description: Fictional identity verification used only by the prototype
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/mock/challenges:
    post:
      operationId: startMockChallenge
      tags: [mock-auth]
      summary: Start a simulated OTP challenge for a fictional test identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockChallengeInput"
      responses:
        "200":
          description: Simulated challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockChallengeResponse"
        "400":
          description: Invalid request
        "404":
          description: No matching fictional test identity
        "429":
          description: Too many demo requests
  /auth/mock/challenges/verify:
    post:
      operationId: verifyMockChallenge
      tags: [mock-auth]
      summary: Verify a simulated OTP challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockVerifyInput"
      responses:
        "200":
          description: Challenge verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockVerifyResponse"
        "400":
          description: Invalid or incorrect OTP
        "404":
          description: Challenge expired or not found
        "429":
          description: Challenge attempt limit reached
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MockChallengeInput:
      type: object
      properties:
        idNumber:
          type: string
          minLength: 1
          maxLength: 64
        phoneNumber:
          type: string
          description: Real Ethiopian phone number to receive real cellular SMS
      required:
        - idNumber
    MockChallengeResponse:
      type: object
      properties:
        challengeId:
          type: string
        maskedPhone:
          type: string
        expiresInSeconds:
          type: integer
        demoOtp:
          type: string
          description: Test-only OTP. Never present in a real identity provider response.
        smsSent:
          type: boolean
        smsProvider:
          type: string
        smsNotice:
          type: string
      required:
        - challengeId
        - maskedPhone
        - expiresInSeconds
        - demoOtp
    MockVerifyInput:
      type: object
      properties:
        challengeId:
          type: string
        otp:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^[0-9]{6}$"
      required:
        - challengeId
        - otp
    MockVerifyResponse:
      type: object
      properties:
        verified:
          type: boolean
        displayName:
          type: string
        provider:
          type: string
          enum: [mock]
      required:
        - verified
        - displayName
        - provider

